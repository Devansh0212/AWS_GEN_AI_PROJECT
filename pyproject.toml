[project]
name = "aws-genai-enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG & Conversational Knowledge Assistant on AWS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

